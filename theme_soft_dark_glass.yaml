# Optionales Theme – nach /config/themes/soft_dark_glass.yaml kopieren.
# configuration.yaml braucht dafür:
#   frontend:
#     themes: !include_dir_merge_named themes
Soft Dark Glass:
  modes:
    dark:
      lovelace-background: '#0B0E13'
      primary-background-color: '#0B0E13'
      secondary-background-color: '#151A22'
      card-background-color: rgba(255,255,255,0.055)
      ha-card-border-radius: 22px
      ha-card-box-shadow: none
      primary-text-color: '#E9EDF2'
      secondary-text-color: '#9AA4B2'
      primary-color: '#5AB0FF'
      accent-color: '#FFB547'
      state-icon-active-color: '#FFB547'
      primary-font-family: Inter, system-ui, -apple-system, sans-serif
      app-header-background-color: '#0B0E13'
      app-header-text-color: '#E9EDF2'
